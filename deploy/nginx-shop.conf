# /etc/nginx/sites-available/shop — main site + every shop subdomain.
# Lives next to the amazon-review site; shares nothing with it except the listening
# sockets. No `http2` here: on nginx 1.24 it's a listen-socket flag and would change
# the other site too.
server {
    listen 80;
    listen [::]:80;
    server_name shop.gokuldelicacy.in *.shop.gokuldelicacy.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shop.gokuldelicacy.in *.shop.gokuldelicacy.in;

    ssl_certificate /etc/letsencrypt/live/shop.gokuldelicacy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.gokuldelicacy.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/shop/app/frontend/dist;
    client_max_body_size 5m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Host is passed through untouched: django-tenants picks the shop from it.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change. `expires` (not add_header) keeps the
    # server-wide security headers from conf.d/security.conf.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Client-side routes (/dashboard, /pos, …) all load the SPA.
    location / {
        try_files $uri /index.html;
    }
}
