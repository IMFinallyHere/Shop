# /etc/nginx/sites-available/shop — main site + every shop subdomain.
# Lives next to the amazon-review site; shares nothing with it except the listening
# sockets. No `http2` here: on nginx 1.24 it's a listen-socket flag and would change
# the other site too.

# Per-client request limits (zone names are prefixed so they can't clash with other sites).
# Login: 10/min; signup: 5 at once then 1/min (nginx has no per-hour rate; Django
# also caps it at 5/hour); rest of the API: 20/s with bursts for page loads.
limit_req_zone $binary_remote_addr zone=shop_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=shop_signup:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=shop_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name shop.gokuldelicacy.in *.shop.gokuldelicacy.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shop.gokuldelicacy.in *.shop.gokuldelicacy.in;

    ssl_certificate /etc/letsencrypt/live/shop.gokuldelicacy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.gokuldelicacy.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Any add_header here replaces the server-wide ones from conf.d/security.conf for
    # this site, so they are repeated alongside the Content-Security-Policy.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Inline styles are allowed: React style props and the print views use them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /opt/shop/app/frontend/dist;
    client_max_body_size 5m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    limit_req_status 429;

    # Host is passed through untouched: django-tenants picks the shop from it.
    # X-Forwarded-For is set to the client alone, so nobody can spoof it to dodge limits.
    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        include /etc/nginx/snippets/shop-proxy.conf;
    }

    location = /api/auth/login/ {
        limit_req zone=shop_login burst=5 nodelay;
        include /etc/nginx/snippets/shop-proxy.conf;
    }

    location = /api/auth/signup/ {
        limit_req zone=shop_signup burst=5 nodelay;
        include /etc/nginx/snippets/shop-proxy.conf;
    }

    # Hashed build files never change. `expires` (not add_header) so this location
    # still inherits the security headers above.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Client-side routes (/dashboard, /pos, …) all load the SPA.
    location / {
        try_files $uri /index.html;
    }
}
