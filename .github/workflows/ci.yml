# Every push and pull request: backend tests against Postgres, frontend lint and build.
# Pushes to main that pass are deployed to threadflo.shop with deploy/deploy.sh, logged in
# as the server's `shop` user (it can only update Threadflo and restart its service).
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Test-only values; production settings live in /opt/shop/shared/.env on the server.
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,.localhost,testserver
      TENANT_USERS_DOMAIN: localhost
      DB_NAME: shop
      DB_USER: shop
      DB_PASSWORD: shop
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the server
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to threadflo.shop
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://threadflo.shop
    # One deploy at a time; a newer push waits for the running one instead of cutting it off.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: SSH key for the server's shop user
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy
        run: deploy/deploy.sh
        env:
          DEPLOY_HOST: shop@169.58.71.221
